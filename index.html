<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Learning Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            900: '#0c4a6e',
                        }
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-out',
                        'slide-up': 'slideUp 0.4s ease-out forwards',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            /* slate-50 */
        }

        /* Custom scrollbar for a polished look */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        .topic-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .topic-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }

        /* Styles for the expandable content area */
        .expandable-content {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.3s ease-out;
        }

        .expandable-content.expanded {
            grid-template-rows: 1fr;
        }

        .expandable-inner {
            overflow: hidden;
        }

        /* Rotation for the chevron icon */
        .chevron {
            transition: transform 0.3s ease;
        }

        .expanded-icon .chevron {
            transform: rotate(180deg);
        }
    </style>
</head>

<body
    class="min-h-screen text-slate-800 flex flex-col items-center py-12 px-4 sm:px-6 lg:px-8 selection:bg-brand-100 selection:text-brand-900 animate-fade-in">

    <!-- Header Section -->
    <header class="w-full max-w-4xl text-center mb-12">
        <div class="inline-flex items-center justify-center p-3 bg-brand-100 rounded-full mb-4">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-brand-600" fill="none" viewBox="0 0 24 24"
                stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
            </svg>
        </div>
        <h1 class="text-4xl sm:text-5xl font-bold tracking-tight text-slate-900 mb-4">Welcome to <span
                class="text-transparent bg-clip-text bg-gradient-to-r from-brand-500 to-blue-600">English
                Learning</span></h1>
        <p class="text-lg text-slate-500 max-w-2xl mx-auto">Master the intricacies of the English language. Explore
            structured lessons designed to enhance your grammar, vocabulary, and overall proficiency.</p>
    </header>

    <!-- Main Content Area (List of Topics) -->
    <main class="w-full max-w-3xl">
        <!-- We use a ul but style it heavily -->
        <ul id="topic-list" class="space-y-4">
            <!-- List items will be dynamically generated here by JavaScript -->
        </ul>
    </main>

    <!-- Footer -->
    <footer class="mt-16 text-center text-sm text-slate-400">
        <p>&copy; <span id="current-year"></span> English Learning Hub. Keep practicing!</p>
    </footer>

    <script src="./js/index.js"></script>
</body>

</html>
